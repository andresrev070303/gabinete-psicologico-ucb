sonar.projectKey=andresrev070303_gabinete-psicologico-ucb
sonar.organization=andresrev070303
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Analyze both applications as one project.
sonar.sources=apps/backend/src,apps/frontend/src
sonar.tests=apps/backend/src,apps/backend/test,apps/frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.e2e-spec.ts,**/*.test.mjs
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.e2e-spec.ts,**/*.test.mjs

sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/backend/coverage/e2e/lcov.info

# Generated Drizzle declarations remain available for static analysis.
sonar.coverage.exclusions=**/*.d.ts,apps/backend/src/infrastructure/database/schema.ts,apps/backend/src/infrastructure/database/relations.ts
