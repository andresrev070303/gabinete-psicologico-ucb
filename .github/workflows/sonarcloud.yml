name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Build, test and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Run backend unit tests with coverage
        working-directory: apps/backend
        run: npm run test:cov

      - name: Run backend HTTP tests with coverage
        working-directory: apps/backend
        run: npm run test:e2e -- --coverage

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Check frontend
        working-directory: apps/frontend
        run: |
          npm run lint
          npm run build

      - name: Verify coverage report
        run: |
          test -s apps/backend/coverage/lcov.info
          test -s apps/backend/coverage/e2e/lcov.info

      - name: Upload backend coverage report
        if: ${{ !cancelled() && hashFiles('apps/backend/coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          if-no-files-found: error
          retention-days: 7

      - name: Analyze with SonarCloud and check Quality Gate
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
